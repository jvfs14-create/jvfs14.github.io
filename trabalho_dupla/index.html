<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="destaque">
        <h1>Portal do Cliente</h1>
        <p>Preencha os dados abaixo para criar o seu perfil de forma rápida e segura.</p>
        <span class="tema-tag">Tema: Cadastro de Cliente</span>
    </header>

    <main class="secao">
        <form class="formulario">
            
            <div class="campo-grupo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="campo-texto" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo-grupo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" class="campo-texto" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="campo-grupo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" class="campo-texto" placeholder="Crie uma senha forte" required>
            </div>

            <div class="campo-grupo">
                <label for="data-nascimento">Data de Nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento" class="campo-texto">
            </div>

            <div class="campo-grupo">
                <label for="tipo-cliente">Tipo de Plano:</label>
                <select id="tipo-cliente" name="tipo-cliente">
                    <option value="gratuito">Gratuito (Básico)</option>
                    <option value="premium">Premium (Mensal)</option>
                    <option value="empresarial">Empresarial (Corporativo)</option>
                </select>
            </div>

            <div class="campo-grupo">
                <label>Período de Preferência para Contato:</label>
                <div class="opcoes-radio">
                    <input type="radio" id="manha" name="periodo" value="manha" checked>
                    <label for="manha" class="label-inline">Manhã</label>
                    
                    <input type="radio" id="tarde" name="periodo" value="tarde">
                    <label for="tarde" class="label-inline">Tarde</label>
                </div>
            </div>

            <button type="submit" class="botao-principal">Enviar Cadastro</button>

        </form>
    </main>

    <footer class="rodape">
        <p>Integrantes: João & Raua</p>
        <p>Data da Atividade: 19 de Junho de 2026</p>
        <p>Disciplina: Desenvolvimento Web / Fundamentos de CSS</p>
    </footer>

</body>
</html>
