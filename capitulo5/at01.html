<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>

<body>

    <h1>Cadastro de Novo Usuário</h1>

    <form action="processar-cadastro.php" method="POST">

        <fieldset>

            <legend>Dados de Identificação</legend>

            <p>

                <label for="id-nome">
                    Nome Completo:
                </label>

                <input
                    type="text"
                    id="id-nome"
                    name="nome"
                    required
                    minlength="3"
                    placeholder="Digite seu nome"
                >

            </p>

            <p>

                <label for="id-email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="id-email"
                    name="email"
                    required
                    placeholder="exemplo@email.com"
                >

            </p>

            <p>

                <label for="id-senha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="id-senha"
                    name="senha"
                    required
                    minlength="6"
                >

            </p>

            <button type="submit">
                Cadastrar
            </button>

            <button type="reset">
                Limpar Campos
            </button>

        </fieldset>

    </form>

    <div class="voltar">

        <a href="../index.html">
            ← Voltar para página principal
        </a>

    </div>

</body>
</html>
