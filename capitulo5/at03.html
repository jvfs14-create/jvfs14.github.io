<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de Perfil</title>
</head>

<body>

    <h1>Questionário de Perfil Escolar</h1>

    <form action="salvar-perfil.php" method="POST">

        <fieldset>

            <legend>
                Qual é o seu turno de estudos?
            </legend>

            <p>

                <input
                    type="radio"
                    id="id-matutino"
                    name="turno"
                    value="matutino"
                    required
                >

                <label for="id-matutino">
                    Matutino (Manhã)
                </label>

            </p>

            <p>

                <input
                    type="radio"
                    id="id-vespertino"
                    name="turno"
                    value="vespertino"
                >

                <label for="id-vespertino">
                    Vespertino (Tarde)
                </label>

            </p>

            <p>

                <input
                    type="radio"
                    id="id-noturno"
                    name="turno"
                    value="noturno"
                >

                <label for="id-noturno">
                    Noturno (Noite)
                </label>

            </p>

        </fieldset>

        <fieldset>

            <legend>
                Quais áreas da tecnologia você tem interesse?
            </legend>

            <p>

                <input
                    type="checkbox"
                    id="id-front"
                    name="interesses"
                    value="frontend"
                >

                <label for="id-front">
                    Desenvolvimento Frontend
                </label>

            </p>

            <p>

                <input
                    type="checkbox"
                    id="id-back"
                    name="interesses"
                    value="backend"
                >

                <label for="id-back">
                    Desenvolvimento Backend
                </label>

            </p>

            <p>

                <input
                    type="checkbox"
                    id="id-jogos"
                    name="interesses"
                    value="games"
                >

                <label for="id-jogos">
                    Desenvolvimento de Jogos
                </label>

            </p>

            <p>

                <input
                    type="checkbox"
                    id="id-infra"
                    name="interesses"
                    value="infra"
                >

                <label for="id-infra">
                    Infraestrutura e Redes
                </label>

            </p>

        </fieldset>

        <button type="submit">
            Enviar Respostas
        </button>

    </form>

    <div class="voltar">

        <a href="../index.html">
            ← Voltar para página principal
        </a>

    </div>

</body>
</html>
