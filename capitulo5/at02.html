<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
</head>

<body>

    <h1>Fale Conosco</h1>

    <form action="enviar-mensagem.php" method="POST">

        <p>

            <label for="id-assunto">
                Assunto:
            </label>

            <select
                id="id-assunto"
                name="assunto"
                required
            >

                <option value="">
                    -- Selecione uma opção --
                </option>

                <option value="duvida">
                    Dúvidas
                </option>

                <option value="sugestao">
                    Sugestões
                </option>

                <option value="critica">
                    Críticas
                </option>

                <option value="suporte">
                    Suporte Técnico
                </option>

            </select>

        </p>

        <p>

            <label for="id-mensagem">
                Sua Mensagem:
            </label>

            <textarea
                id="id-mensagem"
                name="mensagem"
                rows="6"
                required
                placeholder="Escreva sua mensagem em detalhes aqui..."
            ></textarea>

        </p>

        <button type="submit">
            Enviar Mensagem
        </button>

    </form>

    <div class="voltar">

        <a href="index.html">
            ← Voltar para página principal
        </a>

    </div>

</body>
</html>
