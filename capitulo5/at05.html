<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
</head>

<body>

    <div class="container">

        <h1>Acesso ao Sistema</h1>

        <form action="autenticar.php" method="POST">

            <fieldset>

                <legend>
                    Identificação do Usuário
                </legend>

                <p>

                    <label for="id-login">
                        Nome de Usuário (Login):
                    </label>

                    <input
                        type="text"
                        id="id-login"
                        name="login"
                        required
                        minlength="4"
                        maxlength="15"
                        placeholder="Ex: joao_vitor"
                    >

                </p>

                <p>

                    <label for="id-senha">
                        Senha de Acesso:
                    </label>

                    <input
                        type="password"
                        id="id-senha"
                        name="senha"
                        required
                        minlength="8"
                        placeholder="No mínimo 8 caracteres"
                    >

                </p>

                <button type="submit">
                    Entrar
                </button>

            </fieldset>

        </form>

        <div class="voltar">

            <a href="index.html">
                ← Voltar para página principal
            </a>

        </div>

    </div>

</body>
</html>
