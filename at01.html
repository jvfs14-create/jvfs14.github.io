<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1{
            text-align: center;
            color: #38bdf8;
        }

        form{
            max-width: 500px;
            margin: auto;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
        }

        fieldset{
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 20px;
        }

        legend{
            color: #38bdf8;
            font-weight: bold;
            padding: 0 10px;
        }

        label{
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input{
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        input:focus{
            outline: none;
            border-color: #38bdf8;
        }

        button{
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button[type="submit"]{
            background-color: #22c55e;
            color: white;
        }

        button[type="submit"]:hover{
            background-color: #16a34a;
        }

        button[type="reset"]{
            background-color: #ef4444;
            color: white;
            margin-left: 10px;
        }

        button[type="reset"]:hover{
            background-color: #dc2626;
        }

        .voltar{
            text-align: center;
            margin-top: 20px;
        }

        a{
            color: #22c55e;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <h1>Cadastro de Novo Usuário</h1>

    <form action="processar-cadastro.php" method="POST">

        <fieldset>

            <legend>Dados de Identificação</legend>

            <p>

                <label for="id-nome">
                    Nome Completo:
                </label>

                <input
                    type="text"
                    id="id-nome"
                    name="nome"
                    required
                    minlength="3"
                    placeholder="Digite seu nome"
                >

            </p>

            <p>

                <label for="id-email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="id-email"
                    name="email"
                    required
                    placeholder="exemplo@email.com"
                >

            </p>

            <p>

                <label for="id-senha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="id-senha"
                    name="senha"
                    required
                    minlength="6"
                >

            </p>

            <button type="submit">
                Cadastrar
            </button>

            <button type="reset">
                Limpar Campos
            </button>

        </fieldset>

    </form>

    <div class="voltar">

        <a href="../index.html">
            ← Voltar para página principal
        </a>

    </div>

</body>
</html>
