<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1{
            text-align: center;
            color: #38bdf8;
        }

        form{
            max-width: 600px;
            margin: auto;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
        }

        label{
            display: block;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-weight: bold;
        }

        select,
        textarea{
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        select:focus,
        textarea:focus{
            outline: none;
            border-color: #38bdf8;
        }

        textarea{
            resize: vertical;
        }

        button{
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover{
            background-color: #16a34a;
        }

        .voltar{
            text-align: center;
            margin-top: 20px;
        }

        a{
            color: #22c55e;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <h1>Fale Conosco</h1>

    <form action="enviar-mensagem.php" method="POST">

        <p>

            <label for="id-assunto">
                Assunto:
            </label>

            <select
                id="id-assunto"
                name="assunto"
                required
            >

                <option value="">
                    -- Selecione uma opção --
                </option>

                <option value="duvida">
                    Dúvidas
                </option>

                <option value="sugestao">
                    Sugestões
                </option>

                <option value="critica">
                    Críticas
                </option>

                <option value="suporte">
                    Suporte Técnico
                </option>

            </select>

        </p>

        <p>

            <label for="id-mensagem">
                Sua Mensagem:
            </label>

            <textarea
                id="id-mensagem"
                name="mensagem"
                rows="6"
                required
                placeholder="Escreva sua mensagem em detalhes aqui..."
            ></textarea>

        </p>

        <button type="submit">
            Enviar Mensagem
        </button>

    </form>

    <div class="voltar">

        <a href="../index.html">
            ← Voltar para página principal
        </a>

    </div>

</body>
</html>
